<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Duelo en los Picos</title>
<meta name="theme-color" content="#0b0716">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Duelo Picos">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Silkscreen&display=swap">
<style>
:root{
 --bg:#0b0716;--bg2:#140d26;--bg3:#1d1436;--edge:#33265a;--txt:#efeaff;--mute:#9a90bf;
 --gold:#ffd23f;--mario:#ff4d6d;--vero:#2ee6d6;--ok:#5cff9d;
 --com:#8aa0c8;--rar:#4da3ff;--epi:#b36bff;--leg:#ffb020;
 --d:"Chakra Petch",system-ui,sans-serif;--px:"Silkscreen",ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100dvh;color:var(--txt);font:500 16px/1.4 var(--d);background:
 radial-gradient(700px 400px at 0% -10%,#ff4d6d22,transparent 60%),
 radial-gradient(700px 400px at 100% -10%,#2ee6d622,transparent 60%),
 linear-gradient(#ffffff06 1px,transparent 1px) 0 0/100% 4px,
 var(--bg);
 padding:env(safe-area-inset-top) 0 calc(84px + env(safe-area-inset-bottom));overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.px{font-family:var(--px);letter-spacing:.06em;text-transform:uppercase}
.mute{color:var(--mute)}
.btn{font:700 16px var(--d);letter-spacing:.06em;text-transform:uppercase;background:var(--gold);color:#1a1200;border:0;border-radius:12px;padding:14px 18px;box-shadow:0 4px 0 #a8860f,0 0 24px #ffd23f44;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a8860f}
.btn:disabled{background:var(--bg3);color:var(--mute);box-shadow:none}
.btn.sm{font-size:13px;padding:9px 12px;border-radius:10px;box-shadow:0 3px 0 #a8860f}
.chip{border:1.5px solid var(--edge);background:var(--bg2);border-radius:10px;padding:7px 10px;font-size:13px;color:var(--mute)}

/* ---------- Pantalla de selección ---------- */
.select{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:24px 16px;max-width:560px;margin:0 auto}
.logo{text-align:center}
.logo small{color:var(--gold);font-size:12px}
.logo h1{margin:6px 0 0;font:700 44px/0.95 var(--d);letter-spacing:-.01em;text-transform:uppercase;
 background:linear-gradient(90deg,var(--mario),var(--gold),var(--vero));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px #ffd23f33)}
.logo p{margin:10px 0 0;color:var(--mute)}
.chars{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.char{position:relative;border:2px solid var(--edge);background:linear-gradient(180deg,var(--bg3),var(--bg2));border-radius:18px;padding:18px 10px 14px;display:grid;gap:8px;justify-items:center;overflow:hidden;transition:.15s}
.char::before{content:"";position:absolute;inset:0;opacity:.0;transition:.2s;background:radial-gradient(circle at 50% 30%,var(--c),transparent 70%)}
.char.sel::before{opacity:.25}
.char.sel{border-color:var(--c);box-shadow:0 0 0 2px var(--c),0 0 30px color-mix(in srgb,var(--c) 40%,transparent);transform:translateY(-3px)}
.char[data-p=mario]{--c:var(--mario)}.char[data-p=veronica]{--c:var(--vero)}
.sprite{position:relative;width:84px;height:84px;border-radius:22px;display:grid;place-items:center;font:700 40px var(--d);color:var(--bg);background:var(--c);box-shadow:inset 0 -6px 0 #0003}
.char b{font:700 21px var(--d);text-transform:uppercase;position:relative}
.char .lv{position:relative;font-size:11px;color:var(--gold)}
.char .cls{position:relative;font-size:12px;color:var(--mute)}
.pinrow{display:grid;gap:8px}
.pinrow input{font:700 26px var(--d);letter-spacing:.5em;text-align:center;background:var(--bg2);border:2px solid var(--edge);border-radius:14px;color:var(--txt);padding:12px;width:100%}
.pinrow input:focus{outline:none;border-color:var(--gold)}
.err{color:#ff8fa3;min-height:1.3em;font-size:14px;margin:0;text-align:center}
.blink{animation:blink 1.1s steps(2) infinite}@keyframes blink{50%{opacity:0}}

/* ---------- HUD ---------- */
.hud{position:sticky;top:0;z-index:40;background:#0b0716e8;backdrop-filter:blur(12px);border-bottom:1.5px solid var(--edge);padding:10px 0 9px}
.hud .wrap{display:flex;align-items:center;gap:12px}
.ava{position:relative;width:52px;height:52px;flex:none;border-radius:16px;display:grid;place-items:center;font:700 24px var(--d);color:var(--bg);background:var(--pc)}
.ava i{position:absolute;right:-7px;bottom:-7px;font:400 10px var(--px);background:var(--gold);color:#1a1200;border-radius:7px;padding:3px 5px;border:2px solid var(--bg)}
.me-mario{--pc:var(--mario)}.me-veronica{--pc:var(--vero)}
.hud .info{flex:1;min-width:0}
.hud .nm{display:flex;align-items:baseline;gap:8px}
.hud .nm b{font:700 18px var(--d);text-transform:uppercase}
.hud .nm span{font-size:11px;color:var(--gold)}
.xpbar{position:relative;height:12px;border-radius:4px;background:var(--bg3);border:1.5px solid var(--edge);margin-top:5px;overflow:hidden}
.xpbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--pc),var(--gold));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.xpbar i::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 6px,#0002 6px 8px)}
.hud small{display:block;font-size:11px;color:var(--mute);margin-top:3px}
.icb{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--edge);background:var(--bg2);display:grid;place-items:center;font-size:16px;flex:none}

/* ---------- Secciones ---------- */
.sec-h{display:flex;align-items:center;gap:10px;margin:22px 0 10px}
.sec-h h2{margin:0;font:700 19px var(--d);text-transform:uppercase;letter-spacing:.04em}
.sec-h .px{font-size:10px;color:var(--mute);margin-left:auto}
.panel{background:var(--bg2);border:1.5px solid var(--edge);border-radius:16px;padding:14px;margin:10px 0}

/* Cartas de misión */
.q{position:relative;display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,var(--bg3),var(--bg2));border:1.5px solid var(--edge);border-left:5px solid var(--rc,var(--edge));border-radius:14px;padding:12px;margin:9px 0}
.q .ic{width:48px;height:48px;border-radius:12px;background:var(--bg);border:1.5px solid var(--edge);display:grid;place-items:center;font-size:24px;flex:none}
.q .tx{flex:1;min-width:0}
.q .tx b{display:block;font-weight:700;line-height:1.25}
.q .tx small{display:block;color:var(--mute);font-size:13px;margin-top:2px}
.q .xp{font:400 11px var(--px);color:var(--gold);white-space:nowrap}
.q .rar{font:400 10px var(--px);color:var(--rc);text-transform:uppercase}
.q.done{opacity:.8;border-left-color:var(--ok)}
.q.done .ic{border-color:var(--ok)}
.q .th{width:52px;height:52px;border-radius:10px;object-fit:cover;flex:none;border:2px solid var(--ok)}
.q.lock{opacity:.55}
.q.r-com{--rc:var(--com)}.q.r-rar{--rc:var(--rar)}.q.r-epi{--rc:var(--epi)}.q.r-leg{--rc:var(--leg)}
.q.r-leg{box-shadow:0 0 22px #ffb02033}
.q.r-leg::after{content:"";position:absolute;inset:0;border-radius:14px;pointer-events:none;background:linear-gradient(110deg,transparent 30%,#ffffff14 50%,transparent 70%) -200% 0/200% 100%;animation:shine 3.2s infinite}
@keyframes shine{to{background-position:200% 0}}
.secret{border:2px dashed var(--epi);border-radius:16px;padding:12px;background:#b36bff0f}
.timer{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--bg);border:1.5px solid var(--edge);margin-top:9px}
.timer b{font:700 22px var(--d);color:var(--epi);font-variant-numeric:tabular-nums}
.timer span{font-size:13px;color:var(--mute)}

/* Radar GPS */
.radar{display:flex;align-items:center;gap:10px;font-size:14px}
.radar .dot{width:12px;height:12px;border-radius:50%;background:var(--edge);flex:none}
.radar .dot.on{background:var(--ok);box-shadow:0 0 0 0 #5cff9d88;animation:ping 1.6s infinite}
@keyframes ping{to{box-shadow:0 0 0 12px #5cff9d00}}
.radar span{flex:1}

/* Banner zona */
.alert{position:sticky;top:84px;z-index:30;display:flex;gap:12px;align-items:center;margin:12px 0;padding:14px;border-radius:16px;background:linear-gradient(135deg,#ffd23f,#ffb020);color:#1a1200;box-shadow:0 10px 30px #0009;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.alert b{display:block;font:700 18px var(--d);text-transform:uppercase}
.alert .btn{background:#1a1200;color:var(--gold);box-shadow:none;flex:none}
@keyframes pop{from{transform:scale(.8);opacity:0}}

/* ---------- Duelo ---------- */
.vs{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:18px 12px;border-radius:20px;border:1.5px solid var(--edge);background:linear-gradient(90deg,#ff4d6d1f,transparent 45%,transparent 55%,#2ee6d61f),var(--bg2);margin-top:14px}
.vs .side{position:relative;display:grid;justify-items:center;gap:6px;text-align:center}
.vs .side .ava{width:62px;height:62px;font-size:28px}
.vs .side b{font:700 17px var(--d);text-transform:uppercase}
.vs .side .pts{font:700 28px var(--d);font-variant-numeric:tabular-nums}
.vs .side .ttl{font-size:11px;color:var(--mute)}
.vs .mid{font:700 30px var(--d);color:var(--gold);text-shadow:0 0 18px #ffd23f88;font-style:italic}
.crown{position:absolute;top:-30px;left:50%;margin-left:-11px;font-size:22px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.tug{position:relative;height:16px;border-radius:6px;overflow:hidden;display:flex;margin:14px 0 6px;border:1.5px solid var(--edge)}
.tug i{height:100%;transition:width .6s}
.tug .a{background:var(--mario)}.tug .b{background:var(--vero)}
.tug::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:var(--txt);opacity:.6}
.lead{text-align:center;font-size:15px;margin:6px 0 0}
.stats{display:grid;grid-template-columns:1fr auto 1fr;gap:6px 10px;margin-top:6px;font-variant-numeric:tabular-nums}
.stats div{padding:7px 0;border-top:1px solid var(--edge)}
.stats .l{text-align:right;color:var(--mario);font-weight:700}.stats .r{color:var(--vero);font-weight:700}
.stats .k{text-align:center;color:var(--mute);font-size:13px}
.stats .w{text-shadow:0 0 12px currentColor}
.feed .it{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--edge)}
.feed .it:first-child{border-top:0}
.feed .bd{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}
.feed .bd.mario{background:var(--mario)}.feed .bd.veronica{background:var(--vero)}
.feed small{color:var(--mute);display:block;font-size:12px}
.feed .xp{color:var(--gold);font:400 11px var(--px)}

/* ---------- Trofeos (galería) ---------- */
.filt{display:flex;gap:6px;margin:14px 0 8px}
.filt button{border:1.5px solid var(--edge);background:var(--bg2);border-radius:10px;padding:7px 12px;font-size:13px;color:var(--mute)}
.filt button.on{background:var(--gold);color:#1a1200;border-color:var(--gold)}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gal button{position:relative;border:0;padding:0;border-radius:12px;overflow:hidden;aspect-ratio:1;background:var(--bg3)}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gal .who{position:absolute;left:5px;bottom:5px;width:16px;height:16px;border-radius:5px;border:2px solid var(--bg)}
.gal .who.mario{background:var(--mario)}.gal .who.veronica{background:var(--vero)}
.gal .vt{width:100%;height:100%;display:grid;place-items:center;font-size:28px;color:var(--gold)}
.gal .sx{position:absolute;right:5px;top:5px;font-size:13px}
.empty{text-align:center;color:var(--mute);padding:26px 10px}
.viewer{position:fixed;inset:0;z-index:100;background:#05030cf2;display:grid;grid-template-rows:1fr auto;padding:env(safe-area-inset-top) 12px calc(12px + env(safe-area-inset-bottom))}
.vbox{display:grid;place-items:center;min-height:0;color:var(--mute)}
.viewer img,.viewer video{max-width:100%;max-height:76dvh;border-radius:14px}
.viewer .cap{text-align:center;padding:10px}

/* ---------- Logros ---------- */
.ach{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.ac{border:1.5px solid var(--edge);background:var(--bg2);border-radius:14px;padding:12px;display:grid;gap:4px;position:relative}
.ac .e{font-size:26px;filter:grayscale(1);opacity:.45}
.ac b{font-size:14px;line-height:1.2}
.ac small{color:var(--mute);font-size:12px;line-height:1.3}
.ac.on{border-color:var(--gold);background:linear-gradient(160deg,#ffd23f1a,var(--bg2))}
.ac.on .e{filter:none;opacity:1}
.ac .who2{position:absolute;right:9px;top:9px;display:flex;gap:3px}
.ac .who2 i{width:10px;height:10px;border-radius:3px}
.ac .who2 .mario{background:var(--mario)}.ac .who2 .veronica{background:var(--vero)}

/* ---------- Nav ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#0b0716f2;backdrop-filter:blur(14px);border-top:1.5px solid var(--edge);padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:4px}
nav button{position:relative;flex:1;max-width:120px;background:none;border:0;border-radius:12px;padding:7px 2px;color:var(--mute);display:grid;gap:3px;justify-items:center;font:400 10px var(--px);text-transform:uppercase}
nav button span{font-size:21px;line-height:1}
nav button.on{color:#1a1200;background:var(--gold)}
nav .badge{position:absolute;top:3px;right:calc(50% - 22px);min-width:16px;height:16px;border-radius:8px;background:var(--mario);color:#fff;font:700 10px/16px var(--d);padding:0 4px}

/* ---------- FX ---------- */
.toast{position:fixed;left:50%;bottom:calc(94px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--txt);color:var(--bg);padding:11px 16px;border-radius:12px;z-index:200;font-weight:700;box-shadow:0 10px 30px #0009;max-width:90vw;text-align:center;animation:pop .3s}
.fx{position:fixed;inset:0;z-index:160;pointer-events:none;display:grid;place-items:center}
.fx .big{font:700 46px var(--d);color:var(--gold);text-shadow:0 0 24px #ffd23f,0 4px 0 #a8860f;animation:rise 1.4s ease-out forwards}
@keyframes rise{0%{transform:scale(.5);opacity:0}20%{transform:scale(1.15);opacity:1}100%{transform:translateY(-140px) scale(1);opacity:0}}
.fx .p{position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:2px;animation:burst 1s ease-out forwards}
@keyframes burst{to{transform:translate(var(--x),var(--y)) rotate(540deg);opacity:0}}
.modal{position:fixed;inset:0;z-index:170;background:#05030ce6;display:grid;place-items:center;padding:24px;text-align:center}
.modal .box{background:var(--bg2);border:2px solid var(--gold);border-radius:22px;padding:26px 22px;max-width:340px;box-shadow:0 0 50px #ffd23f44;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.modal .px{color:var(--gold);font-size:12px}
.modal h2{font:700 34px var(--d);margin:8px 0;text-transform:uppercase}
.modal p{color:var(--mute);margin:0 0 16px}
.rec{position:fixed;inset:0;z-index:120;background:#000;display:grid;grid-template-rows:1fr auto}
.rec video{width:100%;height:100%;object-fit:cover;min-height:0}
.rec .ctl{display:flex;gap:14px;align-items:center;justify-content:center;padding:16px 16px calc(18px + env(safe-area-inset-bottom));background:var(--bg)}
.rec .big{width:70px;height:70px;border-radius:50%;border:4px solid var(--txt);background:#ff3355}
.rec .big.on{border-radius:18px;width:62px;height:62px}
.rec .tm{position:absolute;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#000a;padding:5px 12px;border-radius:99px;font:400 13px var(--px)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- SELECCIÓN DE JUGADOR -->
<section class="select" id="login" hidden>
 <div class="logo"><small class="px">Asturias · 5–7 oct</small><h1>Duelo en<br>los Picos</h1><p>Dos jugadores. Misiones secretas. Un solo ganador.</p></div>
 <div class="px mute" style="text-align:center;font-size:11px">Elige jugador</div>
 <div class="chars">
  <button class="char" data-p="mario"><span class="sprite">M</span><b>Mario</b><span class="lv px" data-lv="mario">LVL 1</span><span class="cls" data-cls="mario">Novato</span></button>
  <button class="char" data-p="veronica"><span class="sprite">V</span><b>Verónica</b><span class="lv px" data-lv="veronica">LVL 1</span><span class="cls" data-cls="veronica">Novata</span></button>
 </div>
 <div class="pinrow" id="pinBox" hidden>
  <label class="px mute" for="pinIn" style="font-size:11px;text-align:center">Código de acceso</label>
  <input id="pinIn" type="password" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="••••">
 </div>
 <p class="err" id="loginErr"></p>
 <button class="btn" id="enter" disabled>Elige jugador</button>
</section>

<!-- JUEGO -->
<div id="app" hidden>
 <header class="hud"><div class="wrap">
  <div class="ava" id="hAva"><span id="hIni"></span><i id="hLv">1</i></div>
  <div class="info">
   <div class="nm"><b id="hName"></b><span class="px" id="hTitle"></span></div>
   <div class="xpbar"><i id="hBar"></i></div>
   <small id="hXp"></small>
  </div>
  <button class="icb" id="sndBtn" aria-label="Sonido">🔊</button>
  <button class="icb" id="switch" aria-label="Cambiar jugador">⇄</button>
 </div></header>

 <main class="wrap">
  <!-- MISIONES -->
  <section id="tab-mis">
   <div id="alert" class="alert" hidden></div>
   <div class="panel" id="pushCard" hidden></div>
   <div class="sec-h"><h2>🕶️ Secretas</h2><span class="px" id="secWho"></span></div>
   <div id="secList"></div>
   <div class="sec-h"><h2>🍽️ Diarias</h2><span class="px" id="dayLbl"></span></div>
   <div id="dailyList"></div>
   <div class="sec-h"><h2>📍 Zonas</h2><span class="px">GPS</span></div>
   <div class="panel radar"><span class="dot" id="gDot"></span><span id="gTxt">Radar apagado</span><button class="btn sm" id="gBtn">Activar</button></div>
   <div id="zoneList"></div>
  </section>

  <!-- DUELO -->
  <section id="tab-duel" hidden>
   <div class="vs" id="vs"></div>
   <div class="tug"><i class="a" id="tugA"></i><i class="b" id="tugB"></i></div>
   <p class="lead" id="lead"></p>
   <div class="panel"><div class="stats" id="stats"></div></div>
   <div class="sec-h"><h2>⚡ Actividad</h2></div>
   <div class="panel feed" id="feed"></div>
  </section>

  <!-- TROFEOS -->
  <section id="tab-gal" hidden>
   <div class="sec-h"><h2>🏆 Trofeos</h2><span class="px" id="galN"></span></div>
   <div class="filt" id="filt"><button data-f="all" class="on">Todos</button><button data-f="mario">Mario</button><button data-f="veronica">Verónica</button></div>
   <div class="gal" id="gal"></div>
  </section>

  <!-- LOGROS -->
  <section id="tab-ach" hidden>
   <div class="sec-h"><h2>🎖️ Logros</h2><span class="px" id="achN"></span></div>
   <p class="mute" style="margin:0 0 10px;font-size:14px">Cada logro da +50 XP. El cuadrito de color dice quién lo tiene.</p>
   <div class="ach" id="ach"></div>
  </section>
 </main>
</div>

<nav id="nav" hidden>
 <button data-t="mis" class="on"><span>⚔️</span>Misiones<em class="badge" id="nb" hidden></em></button>
 <button data-t="duel"><span>🆚</span>Duelo</button>
 <button data-t="gal"><span>🏆</span>Trofeos</button>
 <button data-t="ach"><span>🎖️</span>Logros</button>
</nav>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<div class="viewer" id="viewer" hidden><div class="vbox" id="vBox"></div><div class="cap"><div id="vCap" class="mute"></div><button class="btn sm" id="vClose" style="margin-top:10px">Cerrar</button></div></div>

<script>
/* ================= Datos del juego ================= */
const $=id=>document.getElementById(id);
const LS={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const NAMES={mario:"Mario",veronica:"Verónica"};
const OTHER={mario:"veronica",veronica:"mario"};
const ZONES=[
 {id:"cha",name:"Chamartín",lat:40.4722,lng:-3.6828,r:500,ico:"🚉",xp:100,msg:"Punto de partida. Foto de los dos antes de subir."},
 {id:"ovi",name:"Oviedo",lat:43.3674,lng:-5.8563,r:700,ico:"🏰",xp:100,msg:"Foto rápida al pisar Oviedo."},

 {id:"lag",name:"Lagos de Covadonga",lat:43.2717,lng:-4.9869,r:1500,ico:"🏔️",xp:150,msg:"Foto con el lago y los Picos."}
];
const DAYKEYS=["lun","mar","mie"],DAYDATE={lun:"2026-10-05",mar:"2026-10-06",mie:"2026-10-07"},DAYN={lun:"Lunes",mar:"Martes",mie:"Miércoles"};
const MEALS=[["des","Desayuno","☕"],["com","Comida","🍽️"],["cen","Cena","🍷"]];
const MISSIONS=[];
ZONES.forEach(z=>MISSIONS.push({id:"llegada-"+z.id,kind:"zone",zone:z.id,title:"Conquistar "+z.name,xp:z.xp}));
DAYKEYS.forEach(d=>MEALS.forEach(([k,n,ic])=>MISSIONS.push({id:k+"-"+d,kind:"meal",day:d,title:n+" del "+DAYN[d].toLowerCase(),short:n,ico:ic,xp:40})));
const MID=Object.fromEntries(MISSIONS.map(m=>[m.id,m]));
const TITLES=["Novato","Aprendiz","Rastreador","Explorador","Cazador","Veterano","Élite","Maestro","Leyenda","Mito de los Picos"];
const lvlOf=x=>Math.min(TITLES.length,Math.floor(Math.sqrt(x/30))+1);
const xpAt=l=>30*(l-1)**2;
const titleOf=(x,p)=>{let t=TITLES[lvlOf(x)-1];if(p==="veronica")t=t.replace(/o$/,"a").replace("Cazador","Cazadora").replace("Explorador","Exploradora").replace("Rastreador","Rastreadora");return t};
const rarity=xp=>xp>=140?["leg","Legendaria"]:xp>=100?["epi","Épica"]:xp>=60?["rar","Rara"]:["com","Común"];
const madH=ts=>+new Date(ts).toLocaleString("en-GB",{timeZone:"Europe/Madrid",hour:"2-digit",hour12:false});
const madDate=ts=>new Date(ts).toLocaleDateString("sv-SE",{timeZone:"Europe/Madrid"});
const TEST=/^(preview--|localhost|127\.)/.test(location.hostname)||/deploy-preview/.test(location.hostname);
function todayKey(){const d=madDate(Date.now());if(d<=DAYDATE.lun)return "lun";if(d>=DAYDATE.mie)return "mie";return "mar"}
function dayState(k){if(TEST)return "open";const d=madDate(Date.now());return d===DAYDATE[k]?"open":d<DAYDATE[k]?"soon":"past"}

/* ---------- Puntuación y logros ---------- */
const secOf=p=>(p&&p.secret||[]).filter(m=>!m.hidden);
function entries(pk){ // misiones completadas de un jugador
 const p=state.players[pk]||{done:{}},out=[];
 Object.entries(p.done||{}).forEach(([k,v])=>{
  const m=MID[k]||secOf(p).find(s=>s.id===k);if(!m)return;
  out.push({p:pk,k,ts:v.ts,photo:v.photo,m,secret:!MID[k],xp:m.xp});
 });
 return out.sort((a,b)=>a.ts-b.ts);
}
const ACH=[
 {id:"first",e:"🩸",n:"Primera sangre",d:"Completa tu primera misión",t:E=>E.length>=1},
 {id:"zone2",e:"🧭",n:"Explorador",d:"Conquista 2 zonas",t:E=>E.filter(x=>x.m.kind==="zone").length>=2},
 {id:"zone4",e:"🗺️",n:"Dueño del mapa",d:"Conquista las 4 zonas",t:E=>E.filter(x=>x.m.kind==="zone").length>=4},
 {id:"food5",e:"🍖",n:"Gourmet",d:"5 misiones de comida",t:E=>E.filter(x=>x.m.kind==="meal").length>=5},
 {id:"food9",e:"👨‍🍳",n:"Crítico gastronómico",d:"Las 9 comidas del viaje",t:E=>E.filter(x=>x.m.kind==="meal").length>=9},
 {id:"spy3",e:"🕵️",n:"Espía",d:"3 misiones secretas",t:E=>E.filter(x=>x.secret).length>=3},
 {id:"spy6",e:"🥷",n:"Maestro del sigilo",d:"6 misiones secretas",t:E=>E.filter(x=>x.secret).length>=6},
 {id:"video",e:"🎬",n:"Director",d:"Sube tu primer vídeo",t:E=>E.some(x=>/\.(mp4|webm)$/.test(x.photo||""))},
 {id:"legend",e:"💎",n:"Cazador de leyendas",d:"Completa una misión legendaria",t:E=>E.some(x=>x.secret&&x.xp>=140)},
 {id:"early",e:"🌅",n:"Madrugador",d:"Misión antes de las 9:00",t:E=>E.some(x=>{const h=madH(x.ts);return h>=5&&h<9})},
 {id:"night",e:"🌙",n:"Noctámbulo",d:"Misión después de las 23:00",t:E=>E.some(x=>{const h=madH(x.ts);return h>=23||h<4})},
 {id:"combo",e:"🔥",n:"Combo x3",d:"3 misiones en menos de 1 hora",t:E=>E.some((x,i)=>E[i+2]&&E[i+2].ts-x.ts<=3600e3)},
 {id:"first-in",e:"⚡",n:"Pionero",d:"Llega antes que tu rival a 2 zonas",t:(E,pk)=>{const R=state.players[OTHER[pk]].done||{};return E.filter(x=>x.m.kind==="zone"&&(!R[x.k]||R[x.k].ts>x.ts)).length>=2}},
];
const ACH_XP=50;
function score(pk){
 const E=entries(pk),got=ACH.filter(a=>a.t(E,pk));
 const base=E.reduce((a,x)=>a+x.xp,0);
 return {E,got,base,xp:base+got.length*ACH_XP};
}

/* ================= Estado y API ================= */
let me=LS.get("player",null),pin=LS.get("pin",""),state={players:{mario:{done:{},secret:[]},veronica:{done:{},secret:[]}},pinRequired:false};
let armed=false,pos=null,inside=-1,watchId=null,camMission=null,dismissed={},lastXp=null,lastLvl=null,filt="all";
const photoUrl=k=>"/api/photo?key="+encodeURIComponent(k);
const isVid=k=>/\.(mp4|webm)$/.test(k||"");
const hdr=()=>pin?{"x-trip-pin":pin}:{};
async function api(path,opt={}){
 const r=await fetch(path,{...opt,headers:{...hdr(),...(opt.headers||{})}});
 let j=null;try{j=await r.json()}catch(e){}
 if(!r.ok)throw Object.assign(new Error((j&&j.error)||"Error "+r.status),{status:r.status});
 return j;
}
async function refresh(){try{state=await api("/api/state?me="+me);afterState();armed=true}catch(e){}}
function afterState(){checkNewSecret();checkNewAch();render()}

/* ================= Sonido (chiptune mínimo) ================= */
let AC=null,snd=LS.get("snd",true);
document.addEventListener("pointerdown",()=>{if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}else if(AC.state==="suspended")AC.resume()},{passive:true});
function beep(notes){if(!snd||!AC)return;let t=AC.currentTime;notes.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type="square";o.frequency.value=f;g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d);t+=d*.9})}
const SFX={ok:()=>beep([[523,.09],[659,.09],[784,.09],[1047,.18]]),lvl:()=>beep([[392,.1],[523,.1],[659,.1],[784,.1],[1047,.1],[1319,.3]]),tap:()=>beep([[880,.04]]),new:()=>beep([[660,.08],[990,.14]]),err:()=>beep([[200,.15],[150,.2]])};
$("sndBtn").onclick=()=>{snd=!snd;LS.set("snd",snd);$("sndBtn").textContent=snd?"🔊":"🔇";SFX.tap()};
$("sndBtn").textContent=snd?"🔊":"🔇";

/* ================= FX ================= */
function toast(t,ms=2600){document.querySelectorAll(".toast").forEach(x=>x.remove());const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),ms)}
function burst(text){
 const f=document.createElement("div");f.className="fx";f.innerHTML=`<div class="big">${text}</div>`;
 const C=["#ffd23f","#ff4d6d","#2ee6d6","#b36bff","#5cff9d"];
 for(let i=0;i<26;i++){const p=document.createElement("i");p.className="p";const a=Math.random()*Math.PI*2,r=90+Math.random()*120;p.style.cssText=`--x:${Math.cos(a)*r}px;--y:${Math.sin(a)*r}px;background:${C[i%5]}`;f.appendChild(p)}
 document.body.appendChild(f);setTimeout(()=>f.remove(),1500);
}
function modal(kick,title,text,btn="Seguir"){
 const d=document.createElement("div");d.className="modal";
 d.innerHTML=`<div class="box"><div class="px">${kick}</div><h2>${title}</h2><p>${text}</p><button class="btn">${btn}</button></div>`;
 d.querySelector("button").onclick=()=>d.remove();document.body.appendChild(d);
}

/* ================= Render ================= */
function render(){
 if(!me)return;
 const S=score(me),mine=state.players[me]||{done:{},secret:[]},rival=OTHER[me];
 // HUD
 const lv=lvlOf(S.xp),a=xpAt(lv),b=xpAt(lv+1);
 $("hAva").className="ava me-"+me;document.querySelector(".hud").className="hud me-"+me;
 $("hIni").textContent=NAMES[me][0];$("hLv").textContent=lv;$("hName").textContent=NAMES[me];$("hTitle").textContent=titleOf(S.xp,me);
 $("hBar").style.width=(lv>=TITLES.length?100:(S.xp-a)/(b-a)*100)+"%";
 $("hXp").textContent=lv>=TITLES.length?S.xp+" XP · nivel máximo":`${S.xp} XP · ${b-S.xp} para LVL ${lv+1}`;
 if(armed&&lastLvl!==null&&lv>lastLvl){SFX.lvl();modal("Level up","LVL "+lv,titleOf(S.xp,me)+". Tu rival se va a enterar.")}
 lastLvl=lv;lastXp=S.xp;

 // Secretas
 const act=secOf(mine).filter(m=>!mine.done[m.id]);
 $("secWho").textContent=NAMES[rival]+" no las ve";
 let h=act.map(m=>{const [rc,rn]=rarity(m.xp);return `<div class="q r-${rc}" data-id="${m.id}"><div class="ic">${m.kind==="video"?"🎥":"🕶️"}</div><div class="tx"><span class="rar">${rn}</span><b>${m.t.replace(/\{r\}/g,"tu rival")}</b><small>${m.kind==="video"?"Vídeo · máx. 15 s":"Foto"} <span class="xp">+${m.xp} XP</span></small></div><button class="btn sm go">${m.kind==="video"?"Grabar":"Foto"}</button></div>`}).join("");
 if(!act.length)h+=`<div class="q lock"><div class="ic">🔒</div><div class="tx"><b>${secOf(mine).length?"Has limpiado tus secretas":"Aún no tienes misión secreta"}</b><small>Llegarán solas. Activa los avisos para enterarte.</small></div></div>`;
 if(mine.next)h+=`<div class="timer"><span>Próxima secreta en</span><b id="cd" data-t="${mine.next}">--:--</b></div>`;
 const doneS=secOf(mine).filter(m=>mine.done[m.id]);
 if(doneS.length)h+=`<p class="mute" style="font-size:13px;margin:10px 2px 0">Cumplidas: ${doneS.map(m=>m.short).join(" · ")}</p>`;
 $("secList").innerHTML=`<div class="secret">${h}</div>`;
 const nb=$("nb");nb.hidden=!act.length;nb.textContent=act.length;

 // Diarias
 const tk=todayKey();
 $("dayLbl").textContent=TEST?"modo prueba":DAYN[tk];
 const days=TEST?DAYKEYS:[tk];
 $("dailyList").innerHTML=days.map(d=>MEALS.map(([k,n,ic])=>{
  const id=k+"-"+d,m=MID[id],dn=mine.done[id],st=dayState(d);
  const left=dn&&dn.photo?`<img class="th" data-k="${dn.photo}" data-c="${NAMES[me]} · ${m.title}" src="${photoUrl(dn.photo)}" alt="">`:`<div class="ic">${ic}</div>`;
  const btn=dn?`<button class="chip go">Repetir</button>`:st==="open"?`<button class="btn sm go">Foto</button>`:`<span class="chip">${st==="soon"?"Pronto":"Expirada"}</span>`;
  return `<div class="q r-com ${dn?"done":""} ${st!=="open"&&!dn?"lock":""}" data-id="${id}">${left}<div class="tx"><b>${m.title}</b><small>${dn?"✓ Completada":"Foto del plato o la mesa"} <span class="xp">+${m.xp} XP</span></small></div>${btn}</div>`}).join("")).join("");

 // Zonas
 $("zoneList").innerHTML=ZONES.map((z,i)=>{
  const id="llegada-"+z.id,dn=mine.done[id];
  const d=pos?hav(pos.lat,pos.lng,z.lat,z.lng):null,here=i===inside;
  const sub=dn?"✓ Conquistada":here?"¡Estás dentro! Captúrala":d!=null?"A "+fmtD(d):"Activa el radar";
  const left=dn&&dn.photo?`<img class="th" data-k="${dn.photo}" data-c="${NAMES[me]} · ${z.name}" src="${photoUrl(dn.photo)}" alt="">`:`<div class="ic">${z.ico}</div>`;
  const btn=dn?`<button class="chip go">Repetir</button>`:`<button class="btn sm go" ${here||TEST?"":"disabled"}>Capturar</button>`;
  const [rc]=rarity(z.xp);
  return `<div class="q r-${rc} ${dn?"done":""}" data-id="${id}">${left}<div class="tx"><b>${z.name}</b><small>${sub} <span class="xp">+${z.xp} XP</span></small></div>${btn}</div>`}).join("");

 renderDuel();renderGal();renderAch();renderAlert();tickCd();
}

function renderDuel(){
 const A=score("mario"),B=score("veronica"),tot=A.xp+B.xp;
 const lead=A.xp===B.xp?null:A.xp>B.xp?"mario":"veronica";
 const side=(p,s)=>`<div class="side">${lead===p?'<span class="crown">👑</span>':""}<div class="ava me-${p}">${NAMES[p][0]}<i>${lvlOf(s.xp)}</i></div><b>${NAMES[p]}</b><div class="pts" style="color:var(--${p==="mario"?"mario":"vero"})">${s.xp}</div><div class="ttl px">${titleOf(s.xp,p)}</div></div>`;
 $("vs").innerHTML=side("mario",A)+`<div class="mid">VS</div>`+side("veronica",B);
 $("tugA").style.width=(tot?A.xp/tot*100:50)+"%";$("tugB").style.width=(tot?B.xp/tot*100:50)+"%";
 $("lead").innerHTML=!tot?"Nadie ha puntuado. El primero que mueva ficha manda.":lead?`<b style="color:var(--${lead==="mario"?"mario":"vero"})">${NAMES[lead]}</b> gana por <b>${Math.abs(A.xp-B.xp)} XP</b>`:"<b>Empate técnico</b>. Desempatad ya.";
 const rows=[["Misiones",E=>E.length],["Secretas",E=>E.filter(x=>x.secret).length],["Zonas",E=>E.filter(x=>x.m.kind==="zone").length],["Comidas",E=>E.filter(x=>x.m.kind==="meal").length],["Vídeos",E=>E.filter(x=>isVid(x.photo)).length]];
 let st=rows.map(([k,f])=>{const a=f(A.E),b=f(B.E);return `<div class="l ${a>b?"w":""}">${a}</div><div class="k">${k}</div><div class="r ${b>a?"w":""}">${b}</div>`}).join("");
 st+=`<div class="l ${A.got.length>B.got.length?"w":""}">${A.got.length}</div><div class="k">Logros</div><div class="r ${B.got.length>A.got.length?"w":""}">${B.got.length}</div>`;
 $("stats").innerHTML=st;
 const F=[...A.E,...B.E].sort((a,b)=>b.ts-a.ts).slice(0,25);
 $("feed").innerHTML=F.length?F.map(x=>{
  const what=x.secret?`completó la misión secreta <b>${x.m.short}</b>`:x.m.kind==="zone"?`conquistó <b>${x.m.title.replace("Conquistar ","")}</b>`:`registró <b>${x.m.title.toLowerCase()}</b>`;
  return `<div class="it"><span class="bd ${x.p}"></span><div style="flex:1"><div><b>${NAMES[x.p]}</b> ${what} <span class="xp">+${x.xp}</span></div><small>${ago(x.ts)}</small></div></div>`}).join(""):`<div class="empty">Aquí aparecerá cada jugada en directo.</div>`;
}
function renderGal(){
 const all=[...entries("mario"),...entries("veronica")].filter(x=>x.photo).sort((a,b)=>b.ts-a.ts);
 const L=all.filter(x=>filt==="all"||x.p===filt);
 $("galN").textContent=all.length+" capturas";
 $("gal").innerHTML=L.length?L.map(x=>`<button data-k="${x.photo}" data-c="${NAMES[x.p]} · ${x.secret?x.m.short+" (secreta)":x.m.title}">${isVid(x.photo)?`<div class="vt">▶</div>`:`<img loading="lazy" src="${photoUrl(x.photo)}" alt="">`}<span class="who ${x.p}"></span>${x.secret?'<span class="sx">🕶️</span>':""}</button>`).join(""):"";
 if(!L.length)$("gal").innerHTML=`<div class="empty" style="grid-column:1/-1">Sin trofeos todavía. El primero, en Chamartín.</div>`;

document.querySelectorAll("#filt button").forEach(b=>b.onclick=()=>{filt=b.dataset.f;document.querySelectorAll("#filt button").forEach(x=>x.classList.toggle("on",x===b));renderGal()});
function renderAch(){
 const A=score("mario"),B=score("veronica"),mineGot=score(me).got.map(a=>a.id);
 $("achN").textContent=mineGot.length+"/"+ACH.length;
 $("ach").innerHTML=ACH.map(a=>{const ha=A.got.some(x=>x.id===a.id),hb=B.got.some(x=>x.id===a.id);
  return `<div class="ac ${mineGot.includes(a.id)?"on":""}"><div class="who2">${ha?'<i class="mario"></i>':""}${hb?'<i class="veronica"></i>':""}</div><div class="e">${a.e}</div><b>${a.n}</b><small>${a.d}</small></div>`}).join("");
}
function ago(ts){const m=Math.round((Date.now()-ts)/6e4);if(m<1)return "ahora mismo";if(m<60)return "hace "+m+" min";const h=Math.round(m/60);if(h<24)return "hace "+h+" h";return new Date(ts).toLocaleDateString("es-ES",{weekday:"long",hour:"2-digit",minute:"2-digit"})}
function tickCd(){const e=$("cd");if(!e)return;let s=Math.max(0,Math.round((+e.dataset.t-Date.now())/1000));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;e.textContent=(h?h+":":"")+String(m).padStart(2,"0")+":"+String(ss).padStart(2,"0");if(s===0&&!e.dataset.f){e.dataset.f=1;setTimeout(refresh,1500)}}
setInterval(tickCd,1000);

/* ---------- Novedades: secretas y logros ---------- */
function checkNewSecret(){
 if(!me)return;const ids=secOf(state.players[me]).map(m=>m.id),key="seenSec_"+me,seen=LS.get(key,null);
 LS.set(key,ids);if(seen===null)return;
 if(ids.some(i=>!seen.includes(i))){SFX.new();toast("🕶️ ¡Nueva misión secreta!");notify("🕶️ Misión secreta","Tienes una misión nueva. Ábrela sin que te vea tu rival.","sec")}
}
function checkNewAch(){
 if(!me)return;const got=score(me).got,key="seenAch_"+me,seen=LS.get(key,null);
 LS.set(key,got.map(a=>a.id));if(seen===null)return;
 const fresh=got.filter(a=>!seen.includes(a.id));
 if(fresh.length){const a=fresh[0];setTimeout(()=>{SFX.lvl();modal("Logro desbloqueado",a.e+" "+a.n,a.d+". +"+ACH_XP+" XP")},900)}
}

let vUrl=null;
async function openViewer(k,cap){
 const box=$("vBox");box.innerHTML="";$("vCap").textContent=cap;$("viewer").hidden=false;
 if(isVid(k)){box.textContent="Cargando vídeo…";
  try{const r=await fetch(photoUrl(k));if(!r.ok)throw 0;const b=await r.blob();if($("viewer").hidden)return;if(vUrl)URL.revokeObjectURL(vUrl);vUrl=URL.createObjectURL(b);
   const v=document.createElement("video");v.src=vUrl;v.controls=true;v.autoplay=true;v.playsInline=true;box.innerHTML="";box.appendChild(v)}catch(e){box.textContent="No se pudo cargar el vídeo"}
 }else{const i=document.createElement("img");i.src=photoUrl(k);i.alt="";box.appendChild(i)}
}
const closeV=()=>{$("viewer").hidden=true;$("vBox").innerHTML=""};
$("vClose").onclick=closeV;$("viewer").onclick=e=>{if(e.target===$("viewer"))closeV()};

/* ================= Cámara, vídeo y subida ================= */
const missionInfo=id=>MID[id]||secOf(state.players[me]).find(m=>m.id===id)||{};
function openCam(id){camMission=id;const m=missionInfo(id);if(m.kind==="video"){openRecorder(id);return}$("cam").value="";$("cam").click()}
$("cam").addEventListener("change",async()=>{
 const f=$("cam").files[0];if(!f||!camMission)return;const id=camMission;camMission=null;
 try{toast("Subiendo…",15000);const blob=await shrink(f,missionInfo(id).sticker);await upload(id,blob,"image/jpeg")}catch(e){upFail(e)}
});
function upFail(e){SFX.err();toast(e&&e.status===401?"Código incorrecto: vuelve a entrar":"No se pudo subir: "+((e&&e.message)||"error"),4500)}
async function upload(id,blob,type){
 if(blob.size>5.5e6)throw new Error("pesa demasiado ("+(blob.size/1e6).toFixed(1)+" MB)");
 const before=score(me).xp;
 await api(`/api/photo?player=${me}&mission=${id}`,{method:"POST",headers:{"content-type":type},body:blob});
 state=await api("/api/state?me="+me);
 document.querySelectorAll(".toast").forEach(x=>x.remove());
 const gain=score(me).xp-before;
 SFX.ok();burst(gain>0?"+"+gain+" XP":"¡Hecho!");
 if(id.startsWith("llegada-"))dismissed[id]=1;
 afterState();
}
function shrink(file,sticker){return new Promise((res,rej)=>{
 const u=URL.createObjectURL(file),im=new Image();
 im.onload=()=>{const M=1400,k=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext("2d");x.drawImage(im,0,0,c.width,c.height);
  if(sticker){const z=Math.round(Math.min(c.width,c.height)*.28);x.font=z+"px serif";x.textBaseline="top";x.shadowColor="#000a";x.shadowBlur=z/8;x.fillText(sticker,c.width-z*1.25,z*.15);x.font=Math.round(z*.5)+"px serif";x.fillText("💤",c.width-z*1.9,z*.05)}
  URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error("foto no válida")),"image/jpeg",.8)};
 im.onerror=()=>rej(new Error("no se pudo leer la foto"));im.src=u;
})}
let rStream=null,rec=null,rChunks=[],rTimer=null,rFacing="environment";
async function openRecorder(id){
 if(!window.MediaRecorder||!navigator.mediaDevices){toast("Este navegador no puede grabar vídeo aquí",4000);return}
 const d=document.createElement("div");d.className="rec";
 d.innerHTML=`<video id="rv" playsinline muted autoplay></video><div class="tm" id="rt">0:00 / 0:15</div><div class="ctl"><button class="chip" id="rx">Cancelar</button><button class="big" id="rb" aria-label="Grabar"></button><button class="chip" id="rf">Girar</button></div>`;
 document.body.appendChild(d);
 const close=()=>{clearInterval(rTimer);try{if(rec&&rec.state!=="inactive"){rec.onstop=null;rec.stop()}}catch(e){}rec=null;if(rStream)rStream.getTracks().forEach(t=>t.stop());rStream=null;d.remove()};
 const open=async()=>{if(rStream)rStream.getTracks().forEach(t=>t.stop());rStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:rFacing,width:{ideal:640},height:{ideal:480}},audio:true});$("rv").srcObject=rStream;$("rv").style.transform=rFacing==="user"?"scaleX(-1)":""};
 try{await open()}catch(e){close();toast("Sin permiso de cámara o micro",4000);return}
 $("rx").onclick=close;
 $("rf").onclick=async()=>{if(rec)return;rFacing=rFacing==="user"?"environment":"user";try{await open()}catch(e){}};
 $("rb").onclick=()=>{
  if(rec){rec.stop();return}
  const mt=["video/mp4","video/webm;codecs=vp8,opus","video/webm"].find(t=>MediaRecorder.isTypeSupported(t))||"";
  rChunks=[];rec=new MediaRecorder(rStream,{mimeType:mt||undefined,videoBitsPerSecond:700000,audioBitsPerSecond:64000});
  rec.ondataavailable=e=>{if(e.data.size)rChunks.push(e.data)};
  const type=(rec.mimeType||mt||"video/mp4").split(";")[0];
  rec.onstop=async()=>{clearInterval(rTimer);const blob=new Blob(rChunks,{type});close();try{toast("Subiendo vídeo…",20000);await upload(id,blob,type.startsWith("video/mp4")?"video/mp4":"video/webm")}catch(e){upFail(e)}};
  rec.start();$("rb").classList.add("on");$("rx").hidden=true;$("rf").hidden=true;
  const t0=Date.now();rTimer=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);$("rt").textContent=`0:${String(s).padStart(2,"0")} / 0:15`;if(s>=15&&rec)rec.stop()},250);
 };
}

/* ================= Radar GPS ================= */
const hav=(a,b,c,d)=>{const R=6371e3,t=x=>x*Math.PI/180,dl=t(c-a),dn=t(d-b),h=Math.sin(dl/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const fmtD=m=>m<1000?Math.round(m)+" m":(m/1000).toFixed(m<10000?1:0).replace(".",",")+" km";
function startGps(){
 if(!navigator.geolocation){$("gTxt").textContent="Sin GPS en este navegador";return}
 if(watchId!=null)return;
 $("gTxt").textContent="Buscando señal…";
 watchId=navigator.geolocation.watchPosition(p=>{
  pos={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy||0};
  $("gDot").classList.add("on");$("gBtn").hidden=true;
  const prev=inside;
  inside=ZONES.findIndex(z=>hav(pos.lat,pos.lng,z.lat,z.lng)<=z.r+Math.min(pos.acc,300));
  let nd=1e12,near=0;ZONES.forEach((z,i)=>{const d=hav(pos.lat,pos.lng,z.lat,z.lng);if(d<nd){nd=d;near=i}});
  $("gTxt").textContent=inside>=0?"Dentro de "+ZONES[inside].name:"Zona más cercana: "+ZONES[near].name+" · "+fmtD(nd);
  if(inside>=0&&inside!==prev&&!(state.players[me].done||{})["llegada-"+ZONES[inside].id]){SFX.new();notify("📍 ¡Zona descubierta!","Estás en "+ZONES[inside].name+". Captúrala antes que tu rival.","zone")}
  render();
 },e=>{$("gTxt").textContent=e.code===1?"Permiso de ubicación denegado":"Sin señal GPS";$("gDot").classList.remove("on");watchId=null},{enableHighAccuracy:true,maximumAge:10000,timeout:30000});
}
$("gBtn").onclick=()=>startGps();
function renderAlert(){
 const el=$("alert");
 if(inside<0||!me){el.hidden=true;return}
 const z=ZONES[inside],id="llegada-"+z.id;
 if((state.players[me].done||{})[id]||dismissed[id]){el.hidden=true;return}
 el.hidden=false;el.innerHTML=`<div style="flex:1"><b>¡Zona descubierta!</b><span>${z.name}. ${z.msg}</span></div><button class="btn sm">Capturar</button>`;
 el.querySelector("button").onclick=()=>openCam(id);
}

/* ================= Avisos push ================= */
const iosWeb=/iPhone|iPad/.test(navigator.userAgent)&&!window.navigator.standalone;
const b64=u=>{const p="=".repeat((4-u.length%4)%4),r=atob((u+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from(r,c=>c.charCodeAt(0))};
async function pushState(){
 const c=$("pushCard");if(!me)return;
 if(iosWeb){c.hidden=false;c.innerHTML=`<div class="px" style="color:var(--gold);font-size:11px">Avisos</div><p class="mute" style="margin:6px 0 0;font-size:14px">Para que te lleguen las secretas con la app cerrada: Safari → Compartir → <b style="color:var(--txt)">Añadir a pantalla de inicio</b>, y abre el juego desde ese icono.</p>`;return}
 if(!("serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window)){c.hidden=true;return}
 let sub=null;try{const reg=await navigator.serviceWorker.ready;sub=await reg.pushManager.getSubscription()}catch(e){}
 if(Notification.permission==="granted"&&sub&&LS.get("pushOn_"+me,false)){c.hidden=true;return}
 const den=Notification.permission==="denied";
 c.hidden=false;c.innerHTML=`<div style="display:flex;gap:12px;align-items:center"><div style="font-size:28px">🔔</div><div style="flex:1"><b>Activa los avisos</b><div class="mute" style="font-size:13px">${den?"Están bloqueados en los ajustes.":"Te avisamos de cada secreta nueva y cuando tu rival puntúe."}</div></div><button class="btn sm" id="pushBtn" ${den?"disabled":""}>Activar</button></div>`;
 $("pushBtn").onclick=enablePush;
}
async function enablePush(){
 try{
  const perm=await Notification.requestPermission();if(perm!=="granted"){pushState();return}
  const reg=await navigator.serviceWorker.ready;const {key}=await api("/api/push");
  let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(key)});
  await api("/api/push",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({player:me,subscription:sub.toJSON()})});
  LS.set("pushOn_"+me,true);SFX.ok();toast("Avisos activados 🔔");pushState();
 }catch(e){toast("No se pudieron activar: "+((e&&e.message)||"error"),4500)}
}

/* ================= Arranque ================= */
function start(){
 $("login").hidden=true;$("app").hidden=false;$("nav").hidden=false;
 lastLvl=null;armed=false;render();refresh();pushState();
 if(navigator.permissions&&navigator.permissions.query)navigator.permissions.query({name:"geolocation"}).then(r=>{if(r.state==="granted")startGps()}).catch(()=>{});
}
setInterval(()=>{if(me&&!document.hidden)refresh()},20000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&me)refresh()});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
if(me){api("/api/state?me="+me).then(j=>{state=j;if(j.pinRequired&&!pin){me=null;showLogin()}else start()}).catch(()=>start())}else showLogin();
</script>
